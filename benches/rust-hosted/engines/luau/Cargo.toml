[package]
name = "bench-luau"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bench-luau"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../../common" }
mlua = { version = "=0.12.2", features = ["luau", "vendored"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

