[package]
name = "bench-starlark"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bench-starlark"
path = "src/main.rs"

[dependencies]
bench-common = { path = "../../common" }
starlark = "=0.14.2"
anyhow = "1"
