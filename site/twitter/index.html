<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code mode charts</title>
<style>
  :root { --bg: #efefef; --card: #fbfaf8; --ink: #1b1916; --muted: #56524a; --line: rgba(27, 25, 22, 0.15); --link: #ab451f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141416; --card: #1d1d21; --ink: #ececef; --muted: #a4a6ae; --line: #34343a; --link: #e0875f; }
  }
  :root[data-theme="dark"] { --bg: #141416; --card: #1d1d21; --ink: #ececef; --muted: #a4a6ae; --line: #34343a; --link: #e0875f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { margin: 0 0 18px; font-size: 26px; }
  figure { margin: 0 0 24px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  figure img { display: block; width: 100%; height: auto; border-radius: 6px; }
  figcaption { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Code mode charts</h1>
  <figure><img src="scatter.png" alt="Memory vs time to first response, log-log, logos as points."><figcaption><strong>Memory vs time to first response</strong><a href="scatter.png" download>Download</a></figcaption></figure>
  <figure><img src="combined.png" alt="Memory, time to first response and tool call round trip side by side."><figcaption><strong>Combined: memory, start, tool call</strong><a href="combined.png" download>Download</a></figcaption></figure>
  <figure><img src="metric-memory.png" alt="Base memory per invocation."><figcaption><strong>Base memory per invocation</strong><a href="metric-memory.png" download>Download</a></figcaption></figure>
  <figure><img src="metric-start.png" alt="Time to first response."><figcaption><strong>Time to first response</strong><a href="metric-start.png" download>Download</a></figcaption></figure>
  <figure><img src="metric-tool-call.png" alt="Tool call round trip."><figcaption><strong>Tool call round trip</strong><a href="metric-tool-call.png" download>Download</a></figcaption></figure>
  <figure><img src="metric-compute.png" alt="Parse and aggregate 3 MB of JSON."><figcaption><strong>Compute: parse and aggregate 3 MB of JSON</strong><a href="metric-compute.png" download>Download</a></figcaption></figure>
  <figure><img src="metric-density.png" alt="Instances per GiB."><figcaption><strong>Instances per GiB</strong><a href="metric-density.png" download>Download</a></figcaption></figure>
</main>
</body>
</html>
