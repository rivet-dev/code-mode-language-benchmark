<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded sandbox charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Each figure is 1200px wide. Drafts with every row grow taller; cut-down versions stay 4:3. */
  :root {
    --surface: #fcfcfb;
    --backdrop: #e8e7e3;
    --ink: #18181b;
    --ink-2: #45464d;
    --muted: #686a73;
    --grid: #e7e6e2;
    --axis: #b9b8b3;
    --embedded: #2a78d6;
    --process: #eb6834;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--backdrop);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .sheet {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding: 48px 0;
  }

  .tweet {
    position: relative;
    width: 1200px;
    min-height: 900px;
    margin: 0;
    padding: 52px 64px 40px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }

  .tweet h2 {
    margin: 0;
    font-size: 46px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .tweet .sub {
    margin: 12px 0 0;
    max-width: 1060px;
    font-size: 23px;
    line-height: 1.38;
    color: var(--ink-2);
  }

  .legend {
    display: flex;
    gap: 30px;
    margin: 20px 0 0;
    padding: 0;
    list-style: none;
    font-size: 19px;
    font-weight: 500;
    color: var(--ink-2);
  }

  .legend li { display: flex; align-items: center; gap: 10px; }
  .legend .swatch { width: 18px; height: 18px; border-radius: 4px; }

  .plot { position: relative; margin-top: 22px; }

  .group-label {
    position: absolute;
    left: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .row-name {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 21px;
    font-weight: 500;
    white-space: nowrap;
  }

  .logos { display: flex; width: 34px; justify-content: center; }
  .logo { width: 32px; height: 32px; object-fit: contain; }

  .monogram {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--grid);
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 700;
  }

  /* Square at the baseline, 4px rounded at the data end. */
  .bar { position: absolute; height: 22px; border-radius: 0 4px 4px 0; }

  /* A break marks a bar that runs past the end of the axis. */
  .bar-break {
    position: absolute;
    width: 7px;
    height: 32px;
    background: var(--surface);
    transform: skewX(-24deg);
  }

  .value {
    position: absolute;
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
  }

  .gridline { position: absolute; width: 1px; background: var(--grid); }
  .baseline { position: absolute; width: 2px; background: var(--axis); }

  .tick {
    position: absolute;
    transform: translateX(-50%);
    font-size: 16px;
    color: var(--muted);
    white-space: nowrap;
  }

  .note {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
  }
</style>
</head>
<body>
<main class="sheet" id="sheet"></main>
<script>
  // Groups are the boundary between scripts; color follows the group in every chart.
  const GROUPS = {
    embedded: { label: "Embedded in your process", color: "var(--embedded)" },
    process: { label: "Separate process", color: "var(--process)" },
  };
  const GROUP_ORDER = ["embedded", "process"];

  // Logos that may not exist under their own slug fall back to a close relative.
  const LOGO_FALLBACKS = {
    quickjs: ["languages/javascript.svg"],
    luajit: ["languages/lua.svg"],
    cpython: ["languages/python.svg"],
    dash: ["languages/bash.svg"],
    bash: ["languages/bash.svg"],
    lua: ["languages/lua.svg"],
  };

  const ICON_BASE = new URL("../icons/", location.href);

  /** Maps icon slugs to files using the icon manifest, tolerating a missing or partial manifest. */
  async function loadIconFiles() {
    const files = new Map();
    try {
      const response = await fetch(new URL("manifest.json", ICON_BASE), { cache: "no-store" });
      if (!response.ok) return files;
      const manifest = await response.json();
      const entries = Array.isArray(manifest) ? manifest : manifest.entries || manifest.icons || [];
      // Manifest paths may be relative to the page folder ("icons/runtimes/v8.svg").
      for (const entry of entries) {
        if (entry && entry.slug && entry.file) files.set(entry.slug, entry.file.replace(/^(\.\/)?icons\//, ""));
      }
    } catch (error) {
      console.warn("icon manifest unavailable; using direct paths", error);
    }
    return files;
  }

  function monogram(slug) {
    const badge = document.createElement("span");
    badge.className = "monogram";
    badge.textContent = slug.slice(0, 2).toUpperCase();
    badge.dataset.missingLogo = slug;
    return badge;
  }

  /** Returns an img for the slug's logo, trying fallbacks in order, then a monogram badge. */
  function logoElement(slug, iconFiles) {
    const image = document.createElement("img");
    image.className = "logo";
    image.alt = "";
    image.dataset.slug = slug;
    const candidates = [iconFiles.get(slug) || `runtimes/${slug}.svg`, ...(LOGO_FALLBACKS[slug] || [])];
    const tryNext = () => {
      const file = candidates.shift();
      if (file === undefined) {
        image.replaceWith(monogram(slug));
        return;
      }
      image.dataset.file = file;
      image.src = new URL(file, ICON_BASE).href;
    };
    image.addEventListener("error", tryNext);
    tryNext();
    return image;
  }

  function place(element, styles) {
    Object.assign(element.style, styles);
    return element;
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function buildChart(chart, iconFiles) {
    const figure = element("figure", "tweet");
    figure.id = chart.id;
    figure.dataset.file = chart.file;

    const legend = element("ul", "legend");
    for (const groupKey of GROUP_ORDER) {
      const item = element("li");
      const swatch = element("span", "swatch");
      swatch.style.background = GROUPS[groupKey].color;
      item.append(swatch, GROUPS[groupKey].label);
      legend.append(item);
    }

    const plot = element("div", "plot");
    figure.append(element("h2", "", chart.title), element("p", "sub", chart.sub), legend, plot, element("p", "note", chart.note));

    // Layout constants for the plot, in CSS pixels inside the 1072px content box.
    const plotWidth = 1072;
    const trackLeft = 420;
    const valueRoom = 120;
    const trackWidth = plotWidth - trackLeft - valueRoom;
    const groupHeight = 30;
    const rowHeight = 40;
    const scale = (value) => (Math.min(value, chart.max) / chart.max) * trackWidth;

    let cursor = 0;
    for (const groupKey of GROUP_ORDER) {
      const rows = chart.rows.filter((row) => row.group === groupKey);
      if (rows.length === 0) continue;

      plot.append(place(element("div", "group-label", GROUPS[groupKey].label), { top: `${cursor + 6}px` }));
      cursor += groupHeight;

      for (const row of rows) {
        const center = cursor + rowHeight / 2;

        const name = element("div", "row-name");
        const logos = element("span", "logos");
        for (const slug of row.logos) logos.append(logoElement(slug, iconFiles));
        name.append(logos, row.name);
        plot.append(place(name, { left: "0px", top: `${center - 17}px`, height: "34px" }));

        const barWidth = Math.max(3, scale(row.value));
        plot.append(place(element("div", "bar"), {
          left: `${trackLeft}px`,
          top: `${center - 11}px`,
          width: `${barWidth}px`,
          background: GROUPS[groupKey].color,
        }));

        const clipped = row.value > chart.max;
        if (clipped) {
          plot.append(place(element("div", "bar-break"), { left: `${trackLeft + barWidth - 26}px`, top: `${center - 16}px` }));
        }

        plot.append(place(element("div", "value", row.label), { left: `${trackLeft + barWidth + 12}px`, top: `${center - 13}px` }));
        cursor += rowHeight;
      }
      cursor += 10;
    }
    const rowsBottom = cursor;

    // Gridlines and tick labels sit behind the bars, so insert them first.
    const axisParts = [];
    for (const tick of chart.ticks) {
      const x = trackLeft + scale(tick);
      if (tick > 0) {
        axisParts.push(place(element("div", "gridline"), { left: `${x}px`, top: "0px", height: `${rowsBottom}px` }));
      }
      const label = tick === chart.ticks[chart.ticks.length - 1] ? `${tick} ${chart.unit}` : String(tick);
      axisParts.push(place(element("div", "tick", label), { left: `${x}px`, top: `${rowsBottom + 6}px` }));
    }
    axisParts.push(place(element("div", "baseline"), { left: `${trackLeft - 1}px`, top: "0px", height: `${rowsBottom}px` }));
    plot.prepend(...axisParts);
    plot.style.height = `${rowsBottom + 44}px`;

    return figure;
  }

  async function render() {
    const [iconFiles, data] = await Promise.all([
      loadIconFiles(),
      fetch("data.json", { cache: "no-store" }).then((response) => response.json()),
    ]);
    const sheet = document.getElementById("sheet");
    for (const chart of data.charts) sheet.append(buildChart(chart, iconFiles));

    await document.fonts.ready;

    // Wait until every logo has loaded or fallen back to a monogram, for at most five seconds.
    const deadline = performance.now() + 5000;
    while (performance.now() < deadline) {
      const unsettled = [...document.images].filter((image) => !image.complete || image.naturalWidth === 0);
      if (unsettled.length === 0) break;
      await new Promise((resolve) => setTimeout(resolve, 50));
    }
    document.body.dataset.ready = "1";
  }

  render();
</script>
</body>
</html>
